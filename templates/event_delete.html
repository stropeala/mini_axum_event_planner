{% extends "base.html" %}
{% block title %}Delete Event{% endblock %}
{% block content %}
    <h1>Delete Event</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
                <tr>
                    <td>{{ event.name }}</td>
                    <td>{{ event.date }}</td>
                    <td>{{ event.time }}</td>
                    <td>
                        <form method="post" action="/events/delete">
                            <input type="hidden" name="id" value="{{ event.id }}" />
                            <button type="submit" onclick="return confirm('Are you sure you want to delete this event?')">Delete</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
