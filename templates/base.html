<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>{% block title %}Default Title{% endblock %}</title>
    </head>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #333;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .navbar a:hover {
            background-color: #555;
        }

        .navbar button {
            background: none;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-family: Arial, sans-serif;
        }

        .navbar button:hover {
            background-color: #555;
        }

        .navbar form {
            display: inline-flex;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 20px;
        }

        .flash {
            padding: 10px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-weight: bold;
        }

        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        form label {
            font-weight: bold;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="date"],
        form input[type="time"] {
            width: 100%;
            max-width: 360px;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        form input:focus {
            outline: none;
            border-color: #555;
        }

        form button[type="submit"] {
            margin-top: 4px;
            padding: 9px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        form button[type="submit"]:hover {
            background-color: #555;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        thead tr {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }
    </style>
    <body>
            <nav class="navbar">
                <a href="/">Home</a>
                <a href="/events">Event Planner</a>
                <a href="/events/add">Add Event</a>
                <a href="/events/delete">Delete Event</a>
                <a href="/profile">Profile</a>
                <form action="/logout" method="POST" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
                <a href="/login">Login</a>
                <a href="/register">Create User</a>
            </nav>

            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </body>
    </html>
