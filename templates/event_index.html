{% extends "base.html" %}
{% block title %}Event Planner{% endblock %}
{% block content %}
    <h1>Event Planner</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
                <tr>
                    <td>{{ event.name }}</td>
                    <td>{{ event.date }}</td>
                    <td>{{ event.time }}</td>
                    <td><a href="/events/{{ event.id }}"><button>Go to Description</button></a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
