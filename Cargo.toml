[package]
name = "mini_axum_event_planner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
askama = "0.16.0"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = "0.8.9"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.1", features = ["full"] }
